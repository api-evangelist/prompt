aid: prompt
name: Prompt
description: >-
  Prompt (formerly Prompt Therapy Solutions / Prompt EMR, rebranded Prompt Health in June 2025) is a
  cloud-based, AI-assisted electronic medical record and practice-management platform built exclusively
  for outpatient rehabilitation therapy — physical therapy, occupational therapy, speech-language
  pathology, pediatric therapy and chiropractic. Founded in 2017 in Hoboken, New Jersey by Mike Dwyer
  and Adam Baliatico, with its first product launched in 2019, the platform unifies scheduling,
  clinical documentation, billing and claims, patient engagement, analytics and compliance in a single
  system, and is extended by the Sidekick (AI scribing), Insight (compliance analytics), Plus
  (scheduling automation), Engage (patient app), Kiosk (self check-in), Compensation and RCM modules.
  Prompt reports use by 1,000+ United States outpatient rehab and musculoskeletal practices. As of this
  profile the company publishes no public developer program: no API reference, OpenAPI/GraphQL contract,
  SDK or webhook catalog is reachable on any host it controls. The only machine-readable surface it
  serves publicly is the OpenID Connect discovery document for the application identity provider at
  authenticate.promptemr.com, plus an llms.txt written for AI assistants.
