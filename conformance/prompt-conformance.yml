domain_standard_conformance:
  declared_in_contract: false
  note: >-
    The healthcare domain standards Prompt touches (C-CDA, Direct Secure Messaging, Carequality /
    CommonWell / TEFCA) are reached through the Kno2 partnership and are described only in prose on
    Prompt's newsroom. There is no contract — no FHIR CapabilityStatement, no OpenAPI, no service
    base URL publication — in which Prompt declares them, so the domain-standard signal cannot be
    awarded from the contract as the rubric requires. This is a real, closeable gap for Prompt: the
    integration exists, the declaration does not.
